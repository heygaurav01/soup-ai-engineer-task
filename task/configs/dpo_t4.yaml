# ==============================================================================
# Soup DPO Configuration Optimized for NVIDIA Tesla T4 (16GB VRAM)
# Task: Direct Preference Optimization (DPO) with Layer Streaming
# Target Architecture: Turing Compute Capability 7.5 (FP16 Native Tensor Cores)
# Schema: Validated against SoupConfig (src/soup_cli/config/schema.py)
# ==============================================================================

base: Qwen/Qwen2.5-1.5B-Instruct
task: dpo

# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  train: ./data/train.jsonl
  eval: ./data/eval.jsonl
  format: dpo
  max_length: 1024
  val_split: 0.1

# ------------------------------------------------------------------------------
# Training Hyperparameters & Memory Budget Optimizations
# ------------------------------------------------------------------------------
training:
  # Optimization & Schedule
  epochs: 2
  lr: 5.0e-5
  scheduler: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01

  # Batching & Gradient Accumulation
  # Micro-batch of 1 + 8 accumulation steps = Effective batch size of 8
  batch_size: 1
  gradient_accumulation_steps: 8

  # DPO Loss Configuration
  dpo_beta: 0.1                  # Inverse temperature for implicit reward scaling

  # Layer Streaming (Soup Beta Feature)
  # Streams decoder layers from CPU host RAM into pre-allocated VRAM buffers
  stream_layers: true
  stream_source: auto
  stream_buffers: 2

  # Quantization & Precision (T4 Optimized)
  quantization: 4bit             # BitsAndBytes NF4 (NormalFloat4) with double quant
  gradient_checkpointing: true   # Checkpointing saves ~60% activation memory
  optimizer: paged_adamw_8bit    # Paged 8-bit AdamW to eliminate optimizer memory spikes

  # LoRA (Low-Rank Adaptation) Settings
  lora:
    r: 16                        # Rank 16 provides strong expressiveness with small footprint
    alpha: 32                    # Alpha = 2 * r scaling factor
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  # Checkpointing, Logging & Evaluation
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  seed: 42

# ------------------------------------------------------------------------------
# Output & Artifacts
# ------------------------------------------------------------------------------
output: ./output/dpo_t4_model
